name: Conformance checker

on:
  push:
    branches: [main]
    paths: ["conformance/**", "data/**", "bad_data/**"]
  pull_request:
    paths: ["conformance/**", "data/**", "bad_data/**"]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance

      - name: Format and lint
        working-directory: conformance
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Build and unit tests
        working-directory: conformance
        run: |
          cargo build --release
          cargo test --release

      - name: Run the OGC abstract tests over the corpus
        working-directory: conformance
        run: ./target/release/geoparquet-conf corpus ..

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate the fixture sets
        working-directory: scripts
        run: |
          uv python install 3.12
          uv sync
          uv run python ../conformance/fixtures/generate.py

      - name: Verify fixture verdicts against the manifest
        working-directory: conformance
        run: ./target/release/geoparquet-conf verify fixtures/out --manifest fixtures/expected.json
