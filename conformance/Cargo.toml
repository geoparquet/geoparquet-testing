[package]
name = "geoparquet-conf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = "59.3.0"
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = "0.53.0"
parquet = { version = "59.3.0", features = ["arrow", "zstd", "snap", "lz4", "brotli", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
