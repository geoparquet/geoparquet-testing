[package]
name = "geoparquet-conf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GeoParquet 2.0 OGC abstract tests, without DuckDB"

[dependencies]
anyhow = "1.0.104"
arrow-array = "59.3.0"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
jsonschema = { version = "0.53.0", default-features = false }
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure", "http"] }
parquet = "59.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
